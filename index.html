<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>설정</title>

    <link rel="stylesheet" href="./output.css">
    <style>
        .form-select {
            display: block;
            width: 100%;
            padding: 0.375rem 2.25rem 0.375rem 0.75rem;
            font-size: 1rem;
            font-weight: 400;
            line-height: 1.5;
            color: inherit;
            background-color: transparent;
            background-image: var(--select-arrow);
            background-repeat: no-repeat;
            background-position: right 0.75rem center;
            background-size: 16px 12px;
            border: 1px solid var(--border-color);
            border-radius: 0.375rem;
            transition: border-color .15s ease-in-out,box-shadow .15s ease-in-out;
            appearance: none;
            cursor: pointer;
        }
        .form-select:focus {
            border-color: var(--primary-color);
            outline: 0;
            box-shadow: 0 0 0 0.25rem rgba(var(--primary-rgb), 0.25);
        }
        
        /* Range (Volume) Styles */
        .form-range {
            width: 100%;
            height: 1.5rem;
            padding: 0;
            background-color: transparent;
            appearance: none;
        }
        .form-range:focus {
            outline: 0;
        }
        .form-range::-webkit-slider-thumb {
            width: 1rem;
            height: 1rem;
            margin-top: -0.25rem;
            background-color: var(--primary-color);
            border: 0;
            border-radius: 1rem;
            appearance: none;
        }
        /* 마우스를 누르고 있는 동안(=클릭·드래그 중)에만 손잡이를 강조한다.
           UA가 관리하는 :active는 손잡이 리페인트가 밀리는 경우가 있어 클래스로 직접 제어한다.
           손잡이가 커지므로 트랙(0.5rem) 기준으로 margin-top을 다시 계산해 수직 중심을 유지한다. */
        .form-range.is-dragging::-webkit-slider-thumb {
            width: 1.25rem;
            height: 1.25rem;
            margin-top: -0.375rem;
            box-shadow: 0 0 0 0.35rem rgba(var(--primary-rgb), 0.25);
        }
        .form-range::-webkit-slider-runnable-track {
            width: 100%;
            height: 0.5rem;
            color: transparent;
            cursor: pointer;
            background-color: var(--track-color);
            border-color: transparent;
            border-radius: 1rem;
        }
    </style>
</head>
<!-- 배경/글자색은 input.css의 body 규칙(테마 변수)이 담당한다. -->
<body class="p-[50px_30px_30px]">
<div id="titlebar"></div>
<div class="mx-auto max-w-[500px]">
    <div class="flex items-center justify-between mb-4">
        <h4 class="text-xl font-bold" data-i18n="settingsTitle">설정</h4>
        <!-- data-i18n은 textContent를 덮어쓰므로 아이콘이 있는 이 버튼에는 붙이지 않는다. -->
        <button type="button" class="theme-switch" id="themeSwitch" role="switch" aria-checked="false"
                data-i18n-title="themeToggle" title="라이트/다크 모드 전환">
            <span class="theme-switch-knob">
                <svg class="theme-switch-icon theme-switch-sun" viewBox="0 0 24 24" fill="none"
                     stroke="currentColor" stroke-width="2" stroke-linecap="round">
                    <circle cx="12" cy="12" r="4"/>
                    <path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>
                </svg>
                <svg class="theme-switch-icon theme-switch-moon" viewBox="0 0 24 24" fill="none"
                     stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/>
                </svg>
            </span>
        </button>
    </div>
    <!-- 테마 색상 -->
    <div class="mb-4">
        <label class="block mb-2 text-sm font-medium" data-i18n="themeColor">테마 색상</label>
        <div class="color-palette flex flex-wrap gap-2">
            <button class="color-swatch active" data-color="#e04d45" data-i18n-title="red" style="background:#e04d45;" title="빨강"></button>
            <button class="color-swatch" data-color="#e79243" data-i18n-title="orange" style="background:#e79243;" title="주황"></button>
            <button class="color-swatch" data-color="#f1cd47" data-i18n-title="yellow" style="background:#f1cd47;" title="노랑"></button>
            <button class="color-swatch" data-color="#71c367" data-i18n-title="green" style="background:#71c367;" title="초록"></button>
            <button class="color-swatch" data-color="#6dc4b3" data-i18n-title="mint" style="background:#6dc4b3;" title="민트"></button>
            <button class="color-swatch" data-color="#6cc0cd" data-i18n-title="teal" style="background:#6cc0cd;" title="청록"></button>
            <button class="color-swatch" data-color="#6cbde3" data-i18n-title="cyan" style="background:#6cbde3;" title="시안"></button>
            <button class="color-swatch" data-color="#5388f6" data-i18n-title="blue" style="background:#5388f6;" title="파랑"></button>
            <button class="color-swatch" data-color="#665aec" data-i18n-title="indigo" style="background:#665aec;" title="남색"></button>
            <button class="color-swatch" data-color="#b544d8" data-i18n-title="purple" style="background:#b544d8;" title="보라"></button>
        </div>
    </div>
    <!-- 언어 -->
    <div class="mb-3">
        <label class="block mb-2 text-sm font-medium" data-i18n="language">언어</label>
        <div class="custom-select-dropdown" id="language">
            <button class="form-select text-left" type="button" id="langBtn">
                한국어
            </button>
            <ul class="dropdown-menu w-full">
                <li><button class="dropdown-item active" data-lang="ko">한국어</button></li>
                <li><button class="dropdown-item" data-lang="en">English</button></li>
                <li><button class="dropdown-item" data-lang="ja">日本語</button></li>
                <li><button class="dropdown-item" data-lang="zh-CN">简体中文</button></li>
            </ul>
        </div>
    </div>

    <!-- 슬라이더 -->
    <div class="mb-3">
        <!-- data-i18n이 textContent를 덮어쓰므로 값 표기는 label 밖에 형제로 둔다. -->
        <div class="flex items-center gap-2 mb-2">
            <label class="text-sm font-medium" for="volume" data-i18n="volume">볼륨</label>
            <span class="volume-value" id="volumeValue">75</span>
        </div>
        <input type="range" class="form-range" id="volume" min="0" max="100" value="75">
    </div>

    <div class="mb-4">
        <label class="block mb-2 text-sm font-medium" data-i18n="savePath">저장 경로</label>
        <div class="flex">
            <input type="text" class="flex-1 bg-transparent border border-[var(--border-color)] rounded-l px-3 py-2 focus:border-[var(--primary-color)] focus:outline-none" value="" id="savePath">
            <button class="border border-[var(--border-color)] border-l-0 rounded-r px-4 py-2 hover:bg-[var(--primary-color)] hover:text-[var(--on-primary)] transition-colors" type="button" id="browseBtn" data-i18n="browse">열기</button>
        </div>
    </div>

    <!-- 버튼 -->
    <div class="flex gap-2">
        <button class="bg-[var(--primary-color)] text-[var(--on-primary)] px-6 py-2 rounded hover:brightness-90 transition-all" id="saveBtn" data-i18n="save">저장</button>
        <button class="border border-[var(--border-color)] px-6 py-2 rounded hover:bg-[var(--primary-color)] hover:text-[var(--on-primary)] transition-all" id="cancelBtn" data-i18n="cancel">취소</button>
    </div>
</div>

<script>
    const translations = {
        ko: {
            settingsTitle: '설정', themeColor: '테마 색상', language: '언어', volume: '볼륨',
            savePath: '저장 경로', browse: '열기', save: '저장', cancel: '취소',
            red: '빨강', orange: '주황', yellow: '노랑', green: '초록', mint: '민트',
            teal: '청록', cyan: '시안', blue: '파랑', indigo: '남색', purple: '보라',
            themeToggle: '라이트/다크 모드 전환', savedMessage: '설정이 저장되었습니다.', closeConfirm: '설정창을 닫으시겠습니까?',
            browseDialogTitle: '저장 폴더 선택'
        },
        en: {
            settingsTitle: 'Settings', themeColor: 'Theme color', language: 'Language', volume: 'Volume',
            savePath: 'Save path', browse: 'Browse', save: 'Save', cancel: 'Cancel',
            red: 'Red', orange: 'Orange', yellow: 'Yellow', green: 'Green', mint: 'Mint',
            teal: 'Teal', cyan: 'Cyan', blue: 'Blue', indigo: 'Indigo', purple: 'Purple',
            themeToggle: 'Toggle light/dark mode', savedMessage: 'Settings have been saved.', closeConfirm: 'Do you want to close the settings window?',
            browseDialogTitle: 'Select save folder'
        },
        ja: {
            settingsTitle: '設定', themeColor: 'テーマカラー', language: '言語', volume: '音量',
            savePath: '保存先', browse: '開く', save: '保存', cancel: 'キャンセル',
            red: '赤', orange: 'オレンジ', yellow: '黄', green: '緑', mint: 'ミント',
            teal: '青緑', cyan: 'シアン', blue: '青', indigo: '藍色', purple: '紫',
            themeToggle: 'ライト/ダークモード切り替え', savedMessage: '設定を保存しました。', closeConfirm: '設定ウィンドウを閉じますか？',
            browseDialogTitle: '保存フォルダーを選択'
        },
        'zh-CN': {
            settingsTitle: '设置', themeColor: '主题颜色', language: '语言', volume: '音量',
            savePath: '保存路径', browse: '打开', save: '保存', cancel: '取消',
            red: '红色', orange: '橙色', yellow: '黄色', green: '绿色', mint: '薄荷色',
            teal: '青绿色', cyan: '青色', blue: '蓝色', indigo: '靛蓝色', purple: '紫色',
            themeToggle: '切换浅色/深色模式', savedMessage: '设置已保存。', closeConfirm: '是否关闭设置窗口？',
            browseDialogTitle: '选择保存文件夹'
        }
    };
    const languageOrder = ['ko', 'en', 'ja', 'zh-CN'];
    let selectedLanguage = 'ko';

    function applyLanguage(language) {
        const messages = translations[language];
        if (!messages) return;

        selectedLanguage = language;
        document.documentElement.lang = language;
        document.title = messages.settingsTitle;

        document.querySelectorAll('[data-i18n]').forEach(element => {
            element.textContent = messages[element.dataset.i18n];
        });
        document.querySelectorAll('[data-i18n-title]').forEach(element => {
            element.title = messages[element.dataset.i18nTitle];
        });

        document.querySelectorAll('#language .dropdown-item').forEach(item => {
            item.classList.toggle('active', item.dataset.lang === language);
        });
        langBtn.textContent = document.querySelector(
            `#language .dropdown-item[data-lang="${language}"]`
        ).textContent.trim();

        window.pxvy.setLanguage(languageOrder.indexOf(language));
    }

    // 드롭다운 토글 기능 구현 (Bootstrap 제거 대응)
    const langBtn = document.getElementById('langBtn');
    const langDropdown = document.getElementById('language');
    
    langBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        langDropdown.classList.toggle('show');
    });

    document.addEventListener('click', () => {
        langDropdown.classList.remove('show');
    });
    // 시스템 테마 감지 및 적용
    // 실제 색상 전환은 input.css의 prefers-color-scheme 미디어 쿼리가 처리한다.
    // 여기서는 data-theme 속성과 토글 상태만 현재 모드에 맞춰 둔다.
    const themeSwitch = document.getElementById('themeSwitch');
    const darkModeQuery = window.matchMedia('(prefers-color-scheme: dark)');

    function applyTheme(isDark) {
        document.documentElement.dataset.theme = isDark ? 'dark' : 'light'
        themeSwitch.setAttribute('aria-checked', String(isDark))
    }

    // 토글을 누르면 메인이 nativeTheme.themeSource를 바꾸고, 그 결과가
    // prefers-color-scheme으로 되돌아와 아래 change 핸들러도 함께 호출된다.
    themeSwitch.addEventListener('click', () => {
        const isDark = themeSwitch.getAttribute('aria-checked') !== 'true'

        applyTheme(isDark)
        window.pxvy.setTheme(isDark ? 'dark' : 'light')
    })

    // 초기 적용 - 사용자가 직접 고르기 전까지는 OS 설정을 따른다.
    applyTheme(darkModeQuery.matches)

    const volumeInput = document.getElementById('volume');
    const volumeValue = document.getElementById('volumeValue');

    function applyVolume(volume) {
        volumeInput.value = volume;
        volumeValue.textContent = volume;
    }

    function applyPrimaryColor(hex) {
        const r = parseInt(hex.slice(1, 3), 16);
        const g = parseInt(hex.slice(3, 5), 16);
        const b = parseInt(hex.slice(5, 7), 16);

        document.documentElement.style.setProperty('--primary-color', hex);
        document.documentElement.style.setProperty('--primary-rgb', `${r}, ${g}, ${b}`);

        // 팔레트에 없는 색이 저장돼 있으면 활성 스와치가 없는 상태가 된다.
        document.querySelectorAll('.color-swatch').forEach(swatch => {
            swatch.classList.toggle('active', swatch.dataset.color.toLowerCase() === hex.toLowerCase());
        });
    }

    // electron-store에 저장된 설정을 복원한다.
    // 라이트/다크 모드는 창이 뜨기 전에 메인이 nativeTheme.themeSource로 이미 적용했으므로
    // 위쪽 applyTheme(darkModeQuery.matches)가 그대로 올바른 상태를 잡는다.
    window.pxvy.getSettings().then(settings => {
        applyPrimaryColor(settings.primaryColor);
        applyVolume(settings.volume);
    });

    // 시스템 설정 변경 시 실시간 반영
    darkModeQuery.addEventListener('change', (e) => {
        applyTheme(e.matches)
    })

    // 누르고 있는 동안에만 손잡이를 강조한다.
    // 슬라이더 밖에서 손을 떼도 풀리도록 해제는 window에서 받는다.
    function endVolumeDrag() {
        volumeInput.classList.remove('is-dragging');
    }

    volumeInput.addEventListener('pointerdown', () => {
        volumeInput.classList.add('is-dragging');
    });
    window.addEventListener('pointerup', endVolumeDrag);
    window.addEventListener('pointercancel', endVolumeDrag);

    // 시스템 볼륨 조절 - input의 value는 문자열이라 숫자로 바꿔 보낸다.
    volumeInput.addEventListener('input', (e) => {
        const volume = Number(e.target.value);

        volumeValue.textContent = volume;
        window.pxvy.setVolume(volume);
    });

    document.getElementById('saveBtn').addEventListener('click', () => {
        alert(translations[selectedLanguage].savedMessage)
    })

    document.getElementById('cancelBtn').addEventListener('click', () => {
        if (confirm(translations[selectedLanguage].closeConfirm)) {
            window.close();
        }
    })

    const savePathInput = document.getElementById('savePath');

    window.pxvy.getHomeDirectory().then(homeDirectory => {
        savePathInput.value = homeDirectory;
    });

    document.getElementById('browseBtn').addEventListener('click', async () => {
        const selectedPath = await window.pxvy.selectDirectory(
            savePathInput.value,
            translations[selectedLanguage].browseDialogTitle
        );

        if (selectedPath) {
            savePathInput.value = selectedPath;
        }
    })

    document.querySelectorAll('#language .dropdown-item').forEach(item => {
        item.addEventListener('click', (e) => {
            e.preventDefault();

            applyLanguage(e.currentTarget.dataset.lang);
            console.log('선택된 언어:', selectedLanguage);
        });
    });

    document.querySelectorAll('.color-swatch').forEach(swatch => {
        swatch.addEventListener('click', () => {
            const hex = swatch.dataset.color

            // CSS 변수 + active 스와치 갱신
            applyPrimaryColor(hex)

            // hex → r,g,b 분해 후 main으로 전달 (main이 electron-store에 저장한다)
            window.pxvy.setColor(
                parseInt(hex.slice(1, 3), 16),
                parseInt(hex.slice(3, 5), 16),
                parseInt(hex.slice(5, 7), 16)
            )
            console.log('색상 변경:', hex)
        })
    })
</script>
</body>
</html>
